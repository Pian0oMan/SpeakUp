<!-- MASCOT PREVIEW: open http://localhost:5000/static/mascot.html to see every mood -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speak Up mascot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { padding: 40px; }
    h1 { margin: 0 0 8px; }
    .moods { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; margin-top: 28px; }
    .mood { background: var(--surface); border-radius: 18px; padding: 24px 12px 16px; text-align: center; }
    .mood code { display: block; margin-top: 12px; color: var(--muted); }
    .sizes { display: flex; align-items: flex-end; gap: 24px; margin-top: 40px; }
  </style>
</head>
<body>
  <h1>The mascot</h1>
  <p class="hint">Every mood, at the size used on the home page. Edit static/mascot.js and refresh to see changes.</p>
  <div id="moods" class="moods"></div>
  <h2 style="margin-top: 48px">Sizes</h2>
  <div id="sizes" class="sizes"></div>

  <script src="/static/mascot.js"></script>
  <script>
    ["idle", "happy", "excited", "sad", "sleepy", "surprised", "determined", "wave"].forEach(mood => {
      const box = document.createElement("div");
      box.className = "mood";
      box.innerHTML = mascot(mood, 110) + `<code>${mood}</code>`;
      document.getElementById("moods").appendChild(box);
    });
    [40, 64, 110, 180].forEach(size => {
      document.getElementById("sizes").insertAdjacentHTML("beforeend", mascot("happy", size));
    });
  </script>
</body>
</html>
